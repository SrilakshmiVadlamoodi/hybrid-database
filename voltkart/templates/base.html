<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VoltKart</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="/{% if customer_id %}?customer_id={{ customer_id }}{% endif %}">Catalog</a>
      <a href="/cart{% if customer_id %}?customer_id={{ customer_id }}{% endif %}">Cart</a>
      <a href="/orders{% if customer_id %}?customer_id={{ customer_id }}{% endif %}">Orders</a>
      <a href="/support{% if customer_id %}?customer_id={{ customer_id }}{% endif %}">Support</a>
      <a href="/admin">Admin</a>
    </nav>
    <form method="get" action="{{ request.url.path }}" class="customer-switcher">
      <label for="customer_id">Customer:</label>
      <select name="customer_id" id="customer_id" onchange="this.form.submit()">
        <option value="">-- select --</option>
        {% for c in customers %}
        <option value="{{ c.customer_id }}" {% if customer_id == c.customer_id %}selected{% endif %}>{{ c.full_name }}</option>
        {% endfor %}
      </select>
    </form>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
